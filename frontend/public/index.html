<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="UTF-8" />
    <meta name="author" content="Sachin Kumar" />
    <meta
      name="description"
      content="Welcome to Sachin Kumar's portfolio. 2nd year B.Tech Computer Engineering student at IIIT Bhubaneswar showcasing web development projects, competitive programming, and a journey in computer science."
    />
    <meta
      name="keywords"
      content="Sachin Kumar, Portfolio, Computer Engineering, IIIT Bhubaneswar, Web Developer, JavaScript, HTML, CSS, React, C++, LeetCode, Competitive Programming, DSA"
    />
    <meta name="theme-color" content="#6366f1" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Sachin Kumar | Personal Portfolio" />
    <meta
      property="og:description"
      content="Explore Sachin Kumar's portfolio — B.Tech CE student at IIIT Bhubaneswar, building responsive web applications and solving 150+ problems on LeetCode."
    />
    <meta property="og:image" content="../src/assets/img/media/Sachin.webp" />
    <meta property="og:url" content="https://heysachin.me" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sachin Kumar | Personal Portfolio" />
    <meta
      name="twitter:description"
      content="Sachin Kumar — 2nd year CS student at IIIT Bhubaneswar, web developer, and competitive programmer. Explore projects and skills."
    />
    <meta name="twitter:image" content="URL_to_your_image.jpg" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <!-- Preload LCP and critical above-the-fold / scroll assets -->
    <link
      rel="preload"
      as="image"
      href="%PUBLIC_URL%/home-bg.webp"
      fetchpriority="high"
    />
    <link rel="preload" as="image" href="%PUBLIC_URL%/Sachin.webp" />
    <link
      rel="preload"
      as="image"
      href="%PUBLIC_URL%/Sachin-Profile-Photo.webp"
    />
    <link rel="preload" as="image" href="%PUBLIC_URL%/contact-bg.webp" />
    <!-- Fonts loaded via CSS from src/assets/font (webpack bundles them; no HTML preload) -->
    <!-- Primary Font Awesome: render-blocking for first paint -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link rel="apple-touch-icon" href="./favicon.ico" />
    <!-- Font Awesome 4.7 and 6: load async so first paint isn't blocked -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
      media="print"
      onload="this.media = 'all'"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <!-- <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    /> -->
    <!-- Calendly badge widget end -->
    <title>Sachin Kumar | Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
